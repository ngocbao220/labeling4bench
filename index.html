<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gán nhãn lượt nói</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --fg:#1d2433; --mut:#6b7385; --line:#e3e7ef; --soft:#eef1f6; --acc:#2563eb; --accbg:#eaf1ff; --ok:#16a34a;
          --c0:#3b7bd8; --c1:#e08a2c; --hit:#d93a3a; --r:14px; --sh:0 1px 2px rgba(16,24,40,.05), 0 2px 8px rgba(16,24,40,.04); }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  button { font:inherit; color:inherit; }
  header { display:flex; align-items:center; gap:12px; padding:0 20px; height:52px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; flex:1; font-weight:700; }
  .layout { display:grid; grid-template-columns:220px 1fr; height:calc(100vh - 52px); }
  aside { background:var(--card); border-right:1px solid var(--line); padding:14px 10px; overflow-y:auto; }
  aside h2 { font-size:11px; letter-spacing:.08em; color:var(--mut); margin:0 4px 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { white-space:nowrap; border:1px solid var(--line); border-radius:999px; padding:3px 10px; background:var(--card); cursor:pointer; font-size:13px; }
  .chip.on { background:var(--accbg); border-color:var(--acc); color:var(--acc); }
  .item { border-radius:10px; padding:8px 10px; margin-bottom:4px; cursor:pointer; transition:background .15s; }
  .item:hover { background:var(--soft); }
  .item.on { background:var(--accbg); box-shadow:inset 3px 0 0 var(--acc); }
  .item .top { display:flex; justify-content:space-between; } .item small { color:var(--mut); font-size:12px; }
  .bar { height:4px; background:var(--line); border-radius:4px; margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; background:var(--ok); }
  main { overflow-y:auto; padding:0 24px 24px; }
  .now { display:flex; gap:8px; align-items:center; padding:14px 0 8px; font-weight:600; font-size:16px; }
  .now .sp { flex:1; }
  .badge { border-radius:999px; padding:2px 10px; font-size:12px; background:var(--soft); }
  .src { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px; }
  /* khung nghe luôn dính trên cùng để không phải cuộn lên khi trả lời */
  .stick { position:sticky; top:0; z-index:5; background:var(--bg); padding-bottom:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:10px 14px; box-shadow:var(--sh); }
  .player { display:flex; align-items:center; gap:12px; }
  #playBtn { width:52px; height:52px; border-radius:50%; border:0; background:var(--acc); color:#fff; font-size:20px; cursor:pointer; flex:none; box-shadow:0 4px 12px rgba(37,99,235,.35); transition:transform .1s; }
  #playBtn:active { transform:scale(.94); }
  #cv { flex:1; min-width:0; height:144px; cursor:pointer; display:block; }
  #clock { color:var(--mut); font-variant-numeric:tabular-nums; flex:none; font-size:13px; }
  .ctrl { display:flex; gap:8px 14px; align-items:center; flex-wrap:wrap; margin:8px 2px 0; font-size:14px; color:var(--mut); }
  .ctrl select { font:inherit; padding:3px 6px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .ctrl input { accent-color:var(--acc); width:16px; height:16px; vertical-align:-3px; }
  .btn { border:1px solid var(--line); border-radius:999px; padding:6px 14px; background:var(--card); cursor:pointer; font-size:14px; }
  .btn:hover { background:var(--soft); }
  .btn.warn { color:#b42318; border-color:#f3c7c2; } .btn.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
  .btn.sm { padding:2px 10px; font-size:12px; }
  .dim { opacity:.45; pointer-events:none; }
  .chs { display:flex; flex-direction:column; gap:28px; padding-top:2px; align-self:flex-start; margin-top:10px; flex:none; }
  .chb { height:44px; width:34px; border:0; background:none; font-size:19px; cursor:pointer; padding:0; border-radius:8px; }
  .chb:hover { background:var(--soft); } .chb.off { opacity:.35; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; }
  .tabs { display:flex; gap:4px; padding:4px; background:var(--soft); border-radius:12px; overflow-x:auto; margin-bottom:10px; }
  .tab { flex:1; border:0; border-radius:9px; background:none; padding:8px 14px; cursor:pointer; font-size:15px; font-weight:600; white-space:nowrap; color:var(--mut); }
  .tab small { font-weight:500; font-size:12px; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--line); }
  .tab.full small { background:#dcfce7; color:var(--ok); }
  .tab.on { background:var(--card); color:var(--fg); box-shadow:var(--sh); }
  #pane > *:not(.tabs) { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:4px 16px 10px; box-shadow:var(--sh); margin-bottom:10px; }
  #pane > .marks, #pane > .gh, #pane > .hint { background:none; border:0; box-shadow:none; padding:0; margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:0 28px; }
  .mx table { width:100%; border-collapse:collapse; margin:8px 0; table-layout:fixed; } .mx table + table { border-top:1px solid var(--line); }
  .mx th { font-size:13px; font-weight:500; color:var(--mut); padding:8px 4px 4px; vertical-align:bottom; } .mx th:first-child { text-align:left; font-size:14.5px; font-weight:600; color:var(--fg); width:24%; }
  .mx td { text-align:center; padding:2px; } .mx td:first-child { text-align:left; font-size:14px; } .mx tr.cur td:first-child { font-weight:600; }
  .mx .opt { display:inline-block; padding:4px 10px; } .mx .opt i { width:auto; font-size:18px; }
  .chrow + .chrow { border-top:1px solid var(--line); margin-top:4px; }
  .chrow h4 { margin:10px 0 0; font-size:14px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 28px; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
  .marks { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .sbtn { border:1.5px solid var(--line); border-radius:999px; padding:6px 14px; background:var(--card); cursor:pointer; font-size:14px; }
  .sbtn:hover { border-color:var(--sc); }
  .sbtn.on { border-color:var(--sc); background:color-mix(in srgb, var(--sc) 12%, #fff); font-weight:600; }
  .sbtn .d { color:var(--ok); }
  .gh { font-size:13px; color:var(--mut); font-weight:600; width:100%; }
  .q { padding:10px 0 4px; }
  .q .qt { font-weight:600; margin-bottom:8px; font-size:14.5px; } .q .qt small { font-weight:400; color:var(--mut); }
  .q.cur .qt { color:var(--acc); }
  .opts { display:flex; flex-direction:column; gap:1px; padding-left:4px; }
  .opt { display:flex; gap:10px; align-items:baseline; text-align:left; border:0; border-radius:6px; padding:4px 8px; background:none; cursor:pointer; }
  #pane > .next { background:none; border:0; box-shadow:none; padding:0; display:flex; justify-content:flex-end; }
  .next .btn { padding:10px 22px; font-size:15px; font-weight:600; }
  .opts.inline { flex-direction:row; flex-wrap:nowrap; gap:4px 14px; } .opts.inline .opt { white-space:nowrap; }
  .grid .q:has(.opts.inline) { grid-column:1 / -1; }
  .opt:hover { background:var(--soft); }
  .opt i { flex:none; font-style:normal; color:var(--mut); width:16px; }
  .opt small { color:var(--mut); }
  .opt.sug span::after { content:" · gợi ý"; color:var(--acc); font-size:12px; }
  .opt.on { color:var(--acc); font-weight:600; } .opt.on i { color:var(--acc); }
  .foot { display:flex; } .foot .q { display:flex; gap:14px; align-items:center; } .foot .qt { margin:0; }
  .hint { color:var(--mut); font-size:14px; margin:4px 0 8px; }
  .skipped { padding:24px; text-align:center; color:var(--mut); }
  .help { color:var(--mut); font-size:13px; margin-top:8px; }
  kbd { background:var(--card); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:12px; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; height:auto; } aside { border-right:0; max-height:30vh; } main { padding:0 16px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Gán nhãn lượt nói</h1>
  <button class="btn" id="dl" hidden title="Câu trả lời chỉ lưu trong trình duyệt này; tải file rồi gửi cho người quản lý">⬇ Tải kết quả</button>
</header>
<div class="layout">
  <aside>
    <h2>DANH SÁCH MẪU</h2>
    <div class="chips" id="filters"></div>
    <div id="list"></div>
  </aside>
  <main>
    <div class="now"><span class="sp" id="nowTitle">Đang tải…</span><button class="btn" id="reset" title="Xoá mọi câu trả lời của mẫu này để làm lại từ đầu">↺ Làm lại mẫu</button><button class="btn warn" id="skip" title="Tiếng quá nhỏ, quá rè hoặc không nghe được">Bỏ qua mẫu</button></div>
    <div class="src" id="src"></div>
    <div class="stick"><div class="card player">
      <button id="playBtn" aria-label="Phát / dừng">▶</button>
      <div class="chs"><button class="chb" id="m0" style="--sc:var(--c0)"></button><button class="chb" id="m1" style="--sc:var(--c1)"></button></div>
      <canvas id="cv"></canvas>
      <span id="clock">0:00 / 0:00</span>
    </div>
    <div class="ctrl"><label>Tự dừng ở mốc của <select id="autoStop"><option value="">Không dừng</option><option value="0">Người nói A (trên)</option><option value="1">Người nói B (dưới)</option></select></label></div></div>
        <div id="pane"></div>
    <p class="help">Mẹo: bấm phím <kbd>cách</kbd> để nghe / dừng.</p>
  </main>
</div>
<script>window.STATIC = true;</script>
<script>
const $ = id => document.getElementById(id), cv = $("cv"), g = cv.getContext("2d");
const css = v => getComputedStyle(document.documentElement).getPropertyValue("--" + v).trim();
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const K = (scope, target, q) => `${scope}|${target}|${q}`;
let SECS = [], GATE = null, list = [], filter = "todo", S = null, A = {}, bufs = [], peaks = [], ac = null, pos = 0, playing = null;
let items = [], cur = 0, autoStop = null;  // null = không dừng, 0/1 = dừng ở mốc của kênh đó
const cache = {}, muted = [false, false];

// chế độ tĩnh (GitHub Pages, export_web.py): không có server, câu trả lời lưu trong localStorage {sid: {khoá: v}}
const LS = "answers", store = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const unkey = k => { const [scope, t, q] = k.split("|"); return { scope, target: scope === "ipu" || scope === "channel" ? +t : t, q }; };
async function sj(u, o) {
  const st = store(), get = async f => (await fetch(f)).json();
  if (u === "/api/answer") {
    const d = JSON.parse(o.body), m = st[d.sample] ||= {}, k = K(d.scope, d.target, d.q);
    if (d.v == null) delete m[k]; else m[k] = d.v;
    localStorage.setItem(LS, JSON.stringify(st)); return d;
  }
  if (u === "/api/samples") return (await get("samples.json")).map(s => {
    const m = st[s.id] || {}, gated = GATE && m[K(GATE.scope, s.id, GATE.q)] === GATE.v;
    return { ...s, done: gated ? s.n : s.need.filter(k => m[k] != null).length };
  });
  if (u.startsWith("/api/sample/")) {
    const s = await get("sample/" + u.slice(12) + ".json");
    s.answers = Object.entries(st[s.id] || {}).map(([k, v]) => ({ ...unkey(k), v })); return s;
  }
  return get(u.slice(1));
}
if (window.STATIC) {
  $("dl").hidden = false;
  $("dl").onclick = () => {
    const who = prompt("Tên người gán:", localStorage.getItem("annotator") || ""); if (who == null) return;
    localStorage.setItem("annotator", who);
    const rows = Object.entries(store()).flatMap(([sid, m]) => Object.entries(m).map(([k, v]) => ({ pair: sid.split("~")[0], sample: sid, ...unkey(k), v, annotator: who })));
    const a = document.createElement("a"); a.download = `answers_${who || "anon"}.jsonl`;
    a.href = URL.createObjectURL(new Blob([rows.map(r => JSON.stringify(r)).join("\n") + "\n"], { type: "application/json" })); a.click();
  };
}
async function j(u, o) {
  if (window.STATIC) return sj(u, o);
  const r = await fetch(u, o);
  if (!(r.headers.get("Content-Type") || "").includes("json"))
    throw new Error(`trang chưa cập nhật (${u}, mã ${r.status}). Hãy báo người quản lý khởi động lại server.`);
  const b = await r.json(); if (!r.ok) throw new Error(b.error || r.status); return b;
}

// ---------- danh sách mẫu ----------
function renderList() {
  const todo = list.filter(s => s.done < s.n).length;
  $("filters").innerHTML = [["todo", `Chưa xong ${todo}`], ["done", `Xong ${list.length - todo}`], ["all", `Tất cả`]]
    .map(([k, n]) => `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${n}</button>`).join("");
  $("list").innerHTML = list.map((s, k) => [s, k]).filter(([s]) => filter === "all" || (filter === "done") === (s.done >= s.n))
    .map(([s, k]) => `<div class="item ${S && S.id === s.id ? "on" : ""}" data-id="${s.id}">
      <div class="top"><b>Mẫu ${k + 1}</b><small>${s.ipus} mốc</small></div><small>Dài ${Math.round(s.t1 - s.t0)} giây · ${esc(s.src)}</small>
      <div class="bar"><i style="width:${100 * s.done / s.n}%"></i></div></div>`).join("");
}
$("filters").onclick = e => { const f = e.target.dataset.f; if (f) { filter = f; renderList(); } };
$("list").onclick = e => { const it = e.target.closest(".item"); if (it) openSample(it.dataset.id); };

// ---------- câu hỏi: thứ tự làm = thông tin cuộc gọi (theo kênh) → từng mốc → mẫu ----------
// tên hiển thị: vai trò trong meta của nguồn (vd. Người nói A / Người nói B), không có thì tên kênh
const name = c => ((S.source || {}).roles || [])[c] || S.speakers[c];
const spk = c => `<span style="color:${css("c" + c)}">${esc(name(c))}</span>`;
const gated = () => GATE && A[K(GATE.scope, S.id, GATE.q)] === GATE.v;
const isDone = it => it.q.optional || A[it.key] != null;
const SECOF = { channel: "call", ipu: "mark", sample: "sample" };
// thứ tự làm theo tab phương diện: câu về người nói → từng mốc; câu mẫu ở cuối
function buildItems() {
  items = [];
  for (const sec of SECS) {
    const qs = sec.qs, a = sec.id;
    for (const q of qs.filter(q => q.scope === "pair")) items.push({ sec: "pair", a, q, key: K("pair", "", q.id) });
    for (const q of qs.filter(q => q.scope === "channel")) for (const c of [0, 1]) items.push({ sec: "call", a, q, c, key: K("channel", c, q.id) });
    S.ipus.forEach((ipu, m) => { for (const q of qs.filter(q => q.scope === "ipu")) items.push({ sec: "mark", a, q, m, ipu, key: K("ipu", ipu.idx, q.id) }); });
    for (const q of qs.filter(q => q.scope === "sample")) items.push({ sec: "sample", a, q, key: K("sample", S.id, q.id) });
  }
}
let tab = null, mark = 0;  // tab phương diện và mốc đang xem
const curMark = () => (items[cur] && items[cur].sec === "mark" ? items[cur].m : mark);

function opts(it, n) {
  const v = A[it.key], sug = it.q.suggest && it.ipu ? it.ipu[it.q.suggest] : null, on = o => it.q.multi ? (v || []).includes(o) : v === o;
  let h = "", grp = null;
  it.q.opts.forEach((o, e) => {
    if (it.q.groups && o[3] !== grp) { grp = o[3]; h += `<div class="gh">${esc(it.q.groups[grp])}</div>`; }
    const mk = it.q.multi ? (on(o[0]) ? "☑" : "☐") : (on(o[0]) ? "●" : "○");
    h += `<button class="opt ${on(o[0]) ? "on" : ""} ${v == null && sug === o[0] ? "sug" : ""}" data-n="${n}" data-v="${o[0]}">
      <i>${mk}</i><span>${esc(o[1])}${o[2] ? ` <small>— ${esc(o[2])}</small>` : ""}</span></button>`;
  });
  return `<div class="opts ${it.q.inline ? "inline" : ""}">${h}</div>`;
}
const qrow = it => { const n = items.indexOf(it);
  return `<div class="q ${n === cur ? "cur" : ""}" data-n="${n}"><div class="qt">${esc(it.q.text)}${it.q.multi ? ` <small>(${it.q.optional ? "chọn nhiều ý, hoặc bỏ trống" : "chọn nhiều ý"})</small>` : ""}</div>${opts(it, n)}</div>`; };

// nút Tiếp: mốc kế tiếp (ở phương diện hỏi theo mốc) → phương diện kế tiếp → mẫu chưa xong kế tiếp
let NEXT = null;
function nextStep(tabs, byMark, m) {
  if (byMark && m + 1 < S.ipus.length) return { label: `Tiếp: Mốc ${m + 2}`, go: () => go(firstOpen(x => x.a === tab && x.sec === "mark" && x.m === m + 1)) };
  const t = tabs[tabs.findIndex(t => t.id === tab) + 1];
  if (t) return { label: `Tiếp: ${t.title}`, go: () => go(firstOpen(x => x.a === t.id && (x.sec !== "mark" || x.m === 0))) };
  const me = list.findIndex(x => x.id === S.id), k = list.findIndex((s, k) => k > me && s.done < s.n);
  return k >= 0 ? { label: "Sang mẫu tiếp theo", go: () => { openSample(list[k].id); $("pane").scrollIntoView(); } } : { label: "Đã hết mẫu", go: () => {} };
}
function render() {
  if (gated()) { $("pane").innerHTML = `<div class="skipped">Mẫu đã bị bỏ qua (không gán được). <button class="btn" id="unskip">Gán lại</button></div>`; draw(); return; }
  const m = mark = curMark(), ipu = S.ipus[m];
  const tabs = SECS.filter(sec => sec.qs.some(q => q.scope !== "sample"));
  tab = items[cur] && tabs.some(t => t.id === items[cur].a) ? items[cur].a : tab || tabs[0].id;
  const sec = SECS.find(t => t.id === tab);
  let h = `<nav class="tabs">${tabs.map(t => { const xs = items.filter(x => x.a === t.id && !x.q.optional), d = xs.filter(isDone).length;
    return `<button class="tab ${t.id === tab ? "on" : ""} ${d === xs.length ? "full" : ""}" data-t="${t.id}">${esc(t.title)}<small>${d}/${xs.length}</small></button>`; }).join("")}</nav>`;
  const ch = items.filter(x => x.sec === "call" && x.a === tab), mk = items.filter(x => x.sec === "mark" && x.a === tab && x.m === m);
  const pr = items.filter(x => x.sec === "pair" && x.a === tab);
  if (sec.note) h += `<p class="hint">${esc(sec.note)}</p>`;
  if (pr.length) h += `<div class="grid">${pr.map(qrow).join("")}</div>`;
  // câu hỏi theo người nói: cùng đáp án cho 2 người nên gom thành bảng, mỗi người một hàng
  if (ch.length && sec.layout === "rows") h += `<div class="rows">${[0, 1].map(c => { const xs = ch.filter(x => x.c === c);
    return `<div class="chrow"><h4>${spk(c)}</h4><div class="grid" style="grid-template-columns:repeat(${xs.length}, minmax(0, 1fr))">${xs.map(qrow).join("")}</div></div>`; }).join("")}</div>`;
  else if (ch.length) h += `<div class="mx">${[...new Set(ch.map(x => x.q))].map(q => `<table><tr><th>${esc(q.text)}</th>${q.opts.map(o => `<th>${esc(o[1])}</th>`).join("")}</tr>${[0, 1].map(c => {
      const it = ch.find(x => x.q === q && x.c === c), n = items.indexOf(it);
      return `<tr class="${n === cur ? "cur" : ""}" data-n="${n}"><td>${spk(c)}</td>${q.opts.map(o => `<td><button class="opt ${A[it.key] === o[0] ? "on" : ""}" data-n="${n}" data-v="${o[0]}" aria-label="${esc(o[1])}"><i>${A[it.key] === o[0] ? "●" : "○"}</i></button></td>`).join("")}</tr>`; }).join("")}</table>`).join("")}</div>`;
  // chọn mốc + nghe theo mốc: chỉ ở phương diện có câu hỏi tại mốc
  if (mk.length) h += `<div class="marks">` + S.ipus.map((i, k) => { const full = items.filter(x => x.sec === "mark" && x.m === k).every(isDone);
      return `<button class="sbtn ${k === m ? "on" : ""}" style="--sc:${css("c" + i.speaker)}" data-m="${k}" title="Chọn mốc ${k + 1}">Mốc ${k + 1} · ${spk(i.speaker)} ${full ? '<span class="d">✓</span>' : ""}</button>`; }).join("") + `</div>`;
  if (mk.length) h += `<div><h4 class="sub">Tại mốc ${m + 1} · ${spk(ipu.speaker)}</h4><div class="grid">${mk.map(qrow).join("")}</div></div>`;
  const nx = nextStep(tabs, mk.length > 0, m);
  h += `<div class="next"><button class="btn pri" id="next">${esc(nx.label)} →</button></div>`;
  $("pane").innerHTML = h; NEXT = nx.go;
  document.querySelector(".q.cur")?.scrollIntoView({ block: "nearest" });
  draw();
}
$("pane").onclick = e => {
  const id = e.target.id;
  if (id === "unskip") return answerKey(K(GATE.scope, S.id, GATE.q), "ok");
  if (id === "next") return NEXT && NEXT();
  const tb = e.target.closest("[data-t]"); if (tb) return go(firstOpen(x => x.a === tb.dataset.t && (x.sec !== "mark" || x.m === mark)));
  const mb = e.target.closest("[data-m]"); if (mb && +mb.dataset.m === mark) return seekMark(mark); if (mb) return go(firstOpen(x => x.a === tab && x.sec === "mark" && x.m === +mb.dataset.m) ?? firstOpen(x => x.sec === "mark" && x.m === +mb.dataset.m));
  const b = e.target.closest(".opt"); if (b) return pick(+b.dataset.n, b.dataset.v);
  const q = e.target.closest("[data-n]"); if (q) go(+q.dataset.n);
};
// câu chưa xong đầu tiên thoả điều kiện, không có thì câu đầu tiên thoả điều kiện
const firstOpen = f => { const xs = items.map((x, n) => [x, n]).filter(([x]) => f(x)); return (xs.find(([x]) => A[x.key] == null && !x.q.optional) || xs[0] || [, cur])[1]; };
function go(n) {
  const pm = mark, pt = tab; cur = Math.max(0, Math.min(n, items.length - 1));
  if (items[cur].sec === "mark" && items[cur].a !== pt && items[cur].m === pm) seekMark(pm);  // vào phần hỏi theo mốc
  if (items[cur].sec === "mark" && items[cur].m !== pm) seekMark(items[cur].m);  // sang mốc khác: đưa con trỏ tới đầu đoạn của mốc, không tự phát
  render();
}

async function answerKey(key, v) {
  const [scope, tg, q] = key.split("|"), target = scope === "ipu" || scope === "channel" ? +tg : tg;
  try {
    await j("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pair: S.pair, sample: S.id, scope, target, q, v }) });
  } catch (e) { alert("Chưa lưu được câu trả lời: " + e.message); return false; }
  A[key] = v; j("/api/samples").then(l => { list = l; renderList(); });
  return true;
}
// câu chọn một: lưu rồi sang câu chưa xong kế tiếp (bỏ qua câu tuỳ chọn); câu chọn nhiều: bật/tắt, ở lại
async function pick(n, code) {
  const it = items[n];
  const v = it.q.multi ? ((A[it.key] || []).includes(code) ? A[it.key].filter(x => x !== code) : [...(A[it.key] || []), code]) : code;
  if (!(await answerKey(it.key, v))) return;
  cur = n; render();  // không tự chuyển câu / phương diện
}
$("reset").onclick = async () => {  // xoá mọi câu trả lời đang hiện của mẫu này (câu đã bỏ khỏi questions.json thì server không nhận nên bỏ qua)
  const ks = [...new Set(items.map(x => x.key))].filter(k => A[k] != null);
  if (!S || !ks.length || !confirm("Xoá hết câu trả lời của mẫu này để làm lại từ đầu?")) return;
  for (const key of ks) if (!(await answerKey(key, null))) return;
  cur = 0; tab = null; render();
};
$("autoStop").onchange = e => { autoStop = e.target.value === "" ? null : +e.target.value; };
$("skip").onclick = () => S && GATE && confirm("Bỏ qua mẫu này vì không nghe rõ?") && answerKey(K(GATE.scope, S.id, GATE.q), GATE.v).then(render);

// ---------- mở mẫu ----------
// wav do pipeline ghi luôn là PCM 16-bit mono: đọc thẳng, không phụ thuộc decodeAudioData
function wavToBuffer(ab) {
  const v = new DataView(ab); let p = 12, sr = 16000;
  while (p + 8 <= v.byteLength) {
    const id = String.fromCharCode(...new Uint8Array(ab, p, 4)), n = v.getUint32(p + 4, true);
    if (id === "fmt ") { if (v.getUint16(p + 8, true) !== 1 || v.getUint16(p + 22, true) !== 16) throw new Error("wav không phải PCM 16-bit"); sr = v.getUint32(p + 12, true); }
    if (id === "data") {
      const k = Math.min(n, v.byteLength - p - 8) >> 1, x = new Float32Array(k);
      for (let i = 0; i < k; i++) x[i] = v.getInt16(p + 8 + 2 * i, true) / 32768;
      const b = ac.createBuffer(1, k, sr); b.copyToChannel(x, 0); return b;
    }
    p += 8 + n + (n & 1);
  }
  throw new Error("wav không có data");
}
// chỉ tải đoạn [t0, t1] của mẫu (file gốc có thể dài hàng chục phút); bufs bắt đầu tại S.t0
const audioOf = s => cache[s.id] ||= Promise.all([0, 1].map(async c => {
  const r = await fetch(window.STATIC ? `audio/${s.id}/ch${c}.wav` : `/audio/${encodeURIComponent(s.pair)}/ch${c}.wav?t0=${s.t0}&t1=${s.t1}`);
  if (!r.ok) throw new Error(`không tải được tiếng của ${S ? name(c) : "kênh " + c}`);
  return wavToBuffer(await r.arrayBuffer());
}));
async function openSample(id) {
  stop(); ac ||= new AudioContext();
  S = await j("/api/sample/" + encodeURIComponent(id));
  A = {}; S.answers.forEach(a => A[K(a.scope, a.target, a.q)] = a.v);
  const k = list.findIndex(s => s.id === id);
  $("nowTitle").innerHTML = `Đang nghe: <b style="color:var(--fg)">Mẫu ${k + 1}</b> <span class="badge">${S.ipus.length} mốc</span>`;
  const src = S.source || {}, roles = src.roles || [];
  $("src").innerHTML =
    [0, 1].map(c => `<span class="badge"><span class="sw" style="background:var(--c${c})"></span>${esc(name(c))}</span>`).join("");
  chBtns();
  buildItems(); tab = null; mark = 0; renderList();
  cur = Math.max(0, items.findIndex(x => !isDone(x))); pos = S.t0; peaks = []; render();
  bufs = []; bufs = await audioOf(S);
  peaks = bufs.map(b => peaksOf(b, 0, S.t1 - S.t0, 600)); draw();
}
function peaksOf(b, t0, t1, n) {
  const d = b.getChannelData(0), sr = b.sampleRate, a = Math.floor(t0 * sr), step = Math.max(1, Math.floor((t1 - t0) * sr / n)), out = [];
  for (let k = 0; k < n; k++) { let m = 0; for (let i = a + k * step, e = Math.min(i + step, d.length); i < e; i++) m = Math.max(m, Math.abs(d[i])); out.push(m); }
  const mx = Math.max(...out, 1e-4); return out.map(v => v / mx);
}

// ---------- vẽ: sóng âm A (trên) / B (dưới), giữa là thanh IPU từng người, dưới cùng là trục giây ----------
// bố cục theo chiều dọc (px); nút tắt tiếng .chb căn theo tâm hai dải sóng
const LY = { a: 24, b: 96, amp: 21, ba: 52, bb: 68, axis: 122 };
const X = t => (t - S.t0) / (S.t1 - S.t0) * cv.clientWidth;
function draw() {
  const W = cv.clientWidth, Hh = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(W * dpr)) { cv.width = W * dpr; cv.height = Hh * dpr; }
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
  if (!S) return;
  const sel = S.ipus[curMark()], own = new Set(S.ipus.map(i => i.idx)), mid = c => c ? LY.b : LY.a, bar = c => c ? LY.bb : LY.ba;
  // vùng ngữ cảnh (không hỏi) tô nền xám
  g.fillStyle = css("soft"); g.fillRect(0, 0, X(S.mark_t0), LY.axis); g.fillRect(X(S.mark_t1), 0, W - X(S.mark_t1), LY.axis);
  // sóng âm dạng đường bao liền
  [0, 1].forEach(c => {
    const p = peaks[c] || [], y = mid(c);
    g.fillStyle = css("c" + c); g.globalAlpha = muted[c] ? 0.15 : 0.6;
    if (!p.length) { g.fillRect(0, y, W, 1); g.globalAlpha = 1; return; }
    g.beginPath(); g.moveTo(0, y);
    p.forEach((v, k) => g.lineTo(k / (p.length - 1) * W, y - Math.max(0.5, v * LY.amp)));
    for (let k = p.length - 1; k >= 0; k--) g.lineTo(k / (p.length - 1) * W, y + Math.max(0.5, p[k] * LY.amp));
    g.closePath(); g.fill(); g.globalAlpha = 1;
  });
  // thanh IPU: ngoặc vuông ở giữa hai dải sóng; mốc cần gán đậm, mốc đang chọn màu đỏ; IPU ngữ cảnh mờ
  g.font = "bold 11px system-ui"; g.textBaseline = "middle";
  S.context.forEach(i => {
    const c = i.speaker, x0 = Math.max(0, X(i.start)), x1 = Math.min(W, X(i.end)), y = bar(c), d = c ? 5 : -5, k = S.ipus.indexOf(i), mine = own.has(i.idx);
    g.strokeStyle = sel && sel.idx === i.idx ? css("hit") : css("c" + c); g.globalAlpha = mine ? (muted[c] ? 0.35 : 1) : 0.35; g.lineWidth = mine ? 2.5 : 1.5;
    g.beginPath(); g.moveTo(x0, y + d); g.lineTo(x0, y); g.lineTo(x1, y); g.lineTo(x1, y + d); g.stroke(); g.globalAlpha = 1;
  });
  // vạch nét đứt ở cuối mỗi mốc, chỉ dài trong dải của người nói đó; số mốc ở mép ngoài
  S.ipus.forEach((i, k) => {
    const c = i.speaker, x = X(i.end), on = sel === i;
    g.strokeStyle = on ? css("hit") : css("fg"); g.lineWidth = on ? 2 : 1.2; g.setLineDash([4, 3]);
    g.beginPath(); g.moveTo(x, c ? bar(c) : 0); g.lineTo(x, c ? LY.axis : bar(c)); g.stroke(); g.setLineDash([]);
    g.fillStyle = on ? css("hit") : css("fg"); g.textAlign = "left"; g.fillText(String(k + 1), x + 3, c ? LY.axis - 7 : 7);
  });
  // trục thời gian (giây tính từ đầu mẫu)
  g.strokeStyle = g.fillStyle = css("mut"); g.lineWidth = 1; g.font = "11px system-ui"; g.textAlign = "center"; g.textBaseline = "alphabetic";
  const dur = S.t1 - S.t0, step = dur > 30 ? 5 : dur > 12 ? 2 : 1;
  for (let t = 0; t <= dur; t += step / 2) {
    const x = X(S.t0 + t), big = Math.abs(t / step - Math.round(t / step)) < 1e-6;
    g.beginPath(); g.moveTo(x, LY.axis); g.lineTo(x, LY.axis + (big ? 6 : 3)); g.stroke();
    if (big && x > 8 && x < W - 8) g.fillText(t + "s", x, LY.axis + 18);
  }
  g.fillStyle = css("fg"); g.fillRect(X(pos), 0, 1.5, LY.axis);
  $("clock").textContent = `${fmt(pos - S.t0)} / ${fmt(dur)}`;
}
addEventListener("resize", () => S && draw());

// ---------- phát: Web Audio, 2 kênh đồng bộ, kênh 0 trái / kênh 1 phải ----------
function stop() {
  if (!playing) return;
  playing.srcs.forEach(s => { try { s.stop(); } catch {} }); cancelAnimationFrame(playing.raf); playing = null; $("playBtn").textContent = "▶";
}
function play(from, until, onEnd) {
  stop(); if (!bufs.length) return; ac.resume();
  from = Math.max(S.t0, Math.min(from, S.t1));
  if (until == null) { const ends = S.ipus.filter(i => i.speaker === autoStop && i.end > from + 0.05).map(i => i.end); until = ends.length ? Math.min(...ends) : S.t1; }  // dừng ở vạch gần nhất của kênh đã chọn (mốc xếp theo lúc bắt đầu, không theo lúc kết thúc)
  until = Math.min(until, S.t1);
  const at = ac.currentTime + 0.05, dur = Math.max(0.05, until - from);
  const gains = [], srcs = bufs.map((b, c) => {
    const s = ac.createBufferSource(), gn = ac.createGain(), pan = new StereoPannerNode(ac, { pan: (c ? 1 : -1) * (S.stereo ? 1 : 0.7) });
    s.buffer = b; gn.gain.value = muted[c] ? 0 : 1; gains[c] = gn; s.connect(gn).connect(pan).connect(ac.destination); s.start(at, from - S.t0, dur); return s;
  });
  playing = { srcs, gains }; $("playBtn").textContent = "❚❚";
  const tick = () => {
    pos = Math.min(from + Math.max(0, ac.currentTime - at), until);
    if (ac.currentTime - at >= dur) { stop(); draw(); onEnd && onEnd(); return; }
    draw(); playing.raf = requestAnimationFrame(tick);
  };
  tick();
}
// nghe lại mốc k: từ vạch của mốc trước (mốc đầu thì từ đầu mẫu) tới vạch của mốc k
// đưa con trỏ tới vạch gần nhất kết thúc trước mốc k (mốc xếp theo lúc bắt đầu, có thể chồng nhau) và dừng ở mốc của người nói đó
const seekMark = k => {
  const i = S.ipus[k]; if (!i) return; stop();
  pos = Math.max(S.t0, ...S.ipus.filter(j => j.end < i.end).map(j => j.end));
  autoStop = i.speaker; $("autoStop").value = autoStop; draw();
};
const replay = k => { if (S.ipus[k]) play(k ? S.ipus[k - 1].end : S.t0, S.ipus[k].end); };
$("playBtn").onclick = () => S && (playing ? stop() : play(pos >= S.t1 - 0.05 ? S.t0 : pos));
function chBtns() {
  [0, 1].forEach(c => { const b = $("m" + c); b.classList.toggle("off", muted[c]);
    const n = S ? name(c) : "kênh " + c; b.textContent = muted[c] ? "🔇" : "🔊";
    b.title = b.ariaLabel = muted[c] ? `Bật tiếng ${n}` : `Tắt tiếng ${n}`; });
}
[0, 1].forEach(c => $("m" + c).onclick = () => {
  muted[c] = !muted[c]; chBtns(); draw();
  if (playing) playing.gains[c].gain.value = muted[c] ? 0 : 1;  // đổi ngay khi đang phát
});
cv.onclick = e => {  // bấm gần vạch nét đứt → chọn mốc đó; chỗ khác → tua tới
  if (!S) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
  const k = S.ipus.findIndex(i => Math.abs(X(i.end) - x) < 8);
  if (k >= 0) return go(firstOpen(it => it.a === tab && it.sec === "mark" && it.m === k));
  pos = S.t0 + x / r.width * (S.t1 - S.t0); playing ? play(pos) : draw();
};

document.onkeydown = e => {
  if (!S || e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = items[cur];
  if (e.key === " ") { e.preventDefault(); $("playBtn").click(); }
  else if (e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key.toLowerCase() === "r") replay(Math.max(0, curMark()));
  else if (e.key.toLowerCase() === "n") {
    const me = list.findIndex(x => x.id === S.id), k = list.findIndex((s, k) => k > me && s.done < s.n); if (k >= 0) openSample(list[k].id);
  }
};

(async () => {
  try {
    for (const sec of (SECS = (await j("/questions.json")).sections)) { for (const q of sec.qs) if (q.gate) GATE = { scope: q.scope, q: q.id, v: q.gate }; }
    list = await j("/api/samples");
    const first = list.find(s => s.done < s.n) || list[0];
    if (first) await openSample(first.id); else { renderList(); $("nowTitle").textContent = "Chưa có mẫu nào để nghe."; }
  } catch (e) { $("nowTitle").textContent = "Lỗi: " + e.message; }
})();
</script>
